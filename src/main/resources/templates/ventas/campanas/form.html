<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Campaña</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5" style="max-width: 700px;">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0"
                th:text="${campana.id == 0} ? 'Nueva Campaña' : 'Editar Campaña'">
            </h4>
        </div>

        <div class="card-body">

            <form th:action="@{/ventas/campanas/guardar}" th:object="${campana}" method="post">

                <input type="hidden" th:field="*{id}"/>

                <!-- Nombre -->
                <div class="mb-3">
                    <label class="form-label fw-bold">Nombre de Campaña</label>
                    <input type="text" class="form-control" th:field="*{nombre}" required
                           placeholder="Ej: Campaña Escolar 2025">
                </div>

                <!-- Fecha Inicio -->
                <div class="mb-3">
                    <label class="form-label fw-bold">Fecha de Inicio</label>
                    <input type="datetime-local" class="form-control" th:field="*{fechaInicio}">
                </div>

                <!-- Fecha Fin -->
                <div class="mb-3">
                    <label class="form-label fw-bold">Fecha de Fin</label>
                    <input type="datetime-local" class="form-control" th:field="*{fechaFin}">
                </div>

                <!-- Botones -->
                <div class="d-flex justify-content-between mt-4">
                    <a th:href="@{/ventas/campanas/lista}" class="btn btn-secondary">
                        Volver
                    </a>

                    <button type="submit" class="btn btn-success px-4">
                        Guardar
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>

</body>
</html>
