<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clientes - Ésika campnaña</title>
    <style>
        body {
          font-family: 'Poppins', sans-serif;
          background: #f9f9fb;
          margin: 0;
          padding: 40px;
          color: #222;
        }

        h2 {
          text-align: center;
          font-size: 1.9rem;
          color: #111;
          margin-bottom: 35px;
          position: relative;
        }

        h2::after {
          content: "";
          width: 90px;
          height: 3px;
          background: #e91e63;
          display: block;
          margin: 8px auto 0;
          border-radius: 2px;
        }

        table {
          width: 85%;
          margin: 0 auto;
          border-collapse: collapse;
          background: #fff;
          border-radius: 12px;
          overflow: hidden;
          box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        th, td {
          padding: 14px 20px;
          text-align: left;
        }

        th {
          background-color: #111;
          color: #fff;
          font-weight: 500;
          letter-spacing: 0.5px;
        }

        tr:nth-child(even) {
          background-color: #fdf3f6;
        }

        tr:hover {
          background-color: #fbe4eb;
          transition: background-color 0.3s ease;
        }

        td {
          color: #333;
          font-size: 0.95rem;
        }

        .actions {
          display: flex;
          gap: 10px;
        }

        .btn {
          text-decoration: none;
          padding: 6px 12px;
          border-radius: 8px;
          font-size: 0.85rem;
          color: #fff;
          transition: all 0.25s ease;
          box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .btn-edit {
          background-color: #e91e63;
        }

        .btn-edit:hover {
          background-color: #c2185b;
          transform: translateY(-2px);
        }

        .btn-del {
          background-color: #111;
        }
        .btn-ver {
          background-color: #e91e76;
        }

        .btn-del:hover {
          background-color: #e91e63;
          transform: translateY(-2px);
        }

        .btn-new {
          display: block;
          width: 220px;
          margin: 40px auto;
          text-align: center;
          background-color: #111;
          color: white;
          padding: 12px 0;
          border-radius: 10px;
          text-decoration: none;
          font-weight: 500;
          letter-spacing: 0.5px;
          transition: all 0.3s ease;
        }

        .btn-new:hover {
          background-color: #e91e63;
          color: white;
          transform: translateY(-3px);
          box-shadow: 0 4px 10px rgba(233,30,99,0.3);
        }
    </style>
</head>
<body>

<h2>Clientes de la campaña: <span th:text="${campana.nombre}"></span></h2>

<p style="text-align:center; margin-top:-20px; color:#e91e63; font-size:1.1rem;">
    Total de clientes: <strong th:text="${totalClientes}"></strong>
</p>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Teléfono</th>
        <th>Acciones</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="cli : ${clientes}">
        <td th:text="${cli.id}"></td>
        <td th:text="${cli.nombre}"></td>
        <td th:text="${cli.telefono}"></td>

        <td class="actions">
            <a th:href="@{'/ventas/cliente/editar/' + ${cli.id}}" class="btn btn-edit">Editar</a>
            <a th:href="@{'/ventas/cliente/eliminar/' + ${cli.id}}" class="btn btn-del">Eliminar</a>
            <a th:href="@{'/ventas/productos/cliente/' + ${cli.id}}" class="btn btn-ver">Productos</a>
        </td>
    </tr>
    </tbody>
</table>

<a th:href="@{'/ventas/cliente/nuevo/' + ${campana.id}}" class="btn-new">+ Nuevo Cliente</a>



</body>
</html>
