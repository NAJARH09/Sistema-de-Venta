<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cliente</title>

    <style>
        body {
            background: #ffe6f2;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            border-top: 6px solid #d63384;
        }

        h2 {
            color: #d63384;
            font-weight: 700;
            margin-bottom: 15px;
        }

        label {
            font-weight: 600;
            color: #333;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 5px;
            border-radius: 10px;
            border: 1px solid #bbb;
        }

        .btn {
            background: #d63384;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            display: inline-block;
            margin-top: 10px;
        }

        .btn:hover {
            background: #ad1457;
        }

        .back-btn {
            background: #6c757d;
        }

        .back-btn:hover {
            background: #545b62;
        }

        .error-box {
            background: #ffe0e6;
            border-left: 5px solid #d63384;
            padding: 12px;
            border-radius: 8px;
            color: #b3003c;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .field-error {
            color: red;
            font-size: 0.9rem;
            margin-bottom: 10px;
            display: block;
        }
    </style>
</head>

<body>

<div class="container">

    <h2 th:text="${cliente.id == 0} ? 'Nuevo Cliente' : 'Editar Cliente'"></h2>

    <form th:action="@{/ventas/cliente/guardar}"
          th:object="${cliente}"
          method="post">

        <!-- ID cliente -->
        <input type="hidden" th:field="*{id}"/>

        <!-- ID campaña -->
        <input type="hidden" th:field="*{campana.id}"/>

        <!-- NOMBRE -->
        <label>Nombre</label>
        <input type="text" th:field="*{nombre}" placeholder="Ej. Ana Torres">
        <span class="field-error"
              th:if="${#fields.hasErrors('nombre')}"
              th:errors="*{nombre}"></span>

        <!-- TELEFONO -->
        <label>Teléfono</label>
        <input type="text" th:field="*{telefono}" placeholder="987654321">
        <span class="field-error"
              th:if="${#fields.hasErrors('telefono')}"
              th:errors="*{telefono}"></span>

        <button type="submit" class="btn">Guardar Cliente</button>

        <a th:href="@{'/ventas/cliente/lista/' + ${cliente.campana.id}}"
           class="btn back-btn" style="margin-left:10px;">
            Volver
        </a>
    </form>


</div>

</body>
</html>
