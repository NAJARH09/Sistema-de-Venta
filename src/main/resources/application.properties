# ===========================
# CONFIGURACIÓN DEL PROYECTO
# ===========================

# Nombre de la aplicación (solo informativo, aparece en los logs)
spring.application.name=com.Producto


# ===========================
# CONEXIÓN A LA BASE DE DATOS
# ===========================

# URL de conexión a MySQL
# Formato: jdbc:mysql://<servidor>:<puerto>/<nombre_base>?serverTimezone=<zona_horaria>
spring.datasource.url=jdbc:mysql://localhost:3306/producto?serverTimezone=America/Lima

# Usuario y contraseña de MySQL
spring.datasource.username=root
spring.datasource.password=root


# ===========================
#  CONFIGURACIÓN DE JPA / HIBERNATE
# ===========================

# Dialecto: indica a Hibernate qué tipo de SQL usar (en este caso, MySQL)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Mostrar en consola las consultas SQL ejecutadas (útil para depurar)
spring.jpa.show-sql=true

# ddl-auto controla cómo Hibernate crea o actualiza las tablas
# Opciones:
# - create: crea las tablas nuevas cada vez (borra las anteriores)
# - update: actualiza tablas existentes sin borrar datos (recomendado en desarrollo)
# - none: no hace cambios automáticos
spring.jpa.hibernate.ddl-auto=update
